{% extends "base.html" %}

{% block content %}
<style>
    .extract-container { background-color: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 900px; margin: 20px; }
    .extract-container h2 { color: #333; border-bottom: 2px solid #d81b2f; padding-bottom: 10px; font-weight: 700; font-size: 20px; }
    
    .form-group { display: flex; align-items: center; margin-bottom: 15px; }
    .form-group label.title-label { width: 160px; font-weight: 600; font-size: 14px; color: #444; margin-bottom: 0; }
    .form-group input[type="text"], .form-group input[type="password"] { flex: 1; padding: 10px; border: 1px solid #ced4da; border-radius: 4px; font-size: 14px; transition: border-color 0.15s; }
    .form-group input:focus { border-color: #80bdff; outline: 0; }
    
    /* 체크박스 스타일 추가 */
    .checkbox-list { display: flex; gap: 15px; flex: 1; flex-wrap: wrap; align-items: center; }
    .checkbox-list label { font-weight: normal; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
    .checkbox-list input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }

    .btn-extract { background-color: #d81b2f; color: white; border: none; border-radius: 4px; padding: 12px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 15px; transition: 0.2s; }
    .btn-extract:hover { background-color: #b01525; }
    .btn-extract:disabled { background-color: #e9ecef; color: #6c757d; cursor: not-allowed; }
    
    .log-area { background-color: #1e1e1e; color: #00ff00; padding: 15px; border-radius: 5px; height: 350px; overflow-y: auto; font-family: Consolas, monospace; font-size: 13px; white-space: pre-wrap; word-wrap: break-word; margin-top: 10px; border: 1px solid #333; }
    
    .info-text { font-size: 12px; color: #6c757d; margin-top: 5px; margin-left: 160px; }
</style>

<div class="extract-container">
    <h2>📦 Oracle DDL 자동 추출기</h2>
    <p style="font-size: 13px; color: #666; margin-bottom: 25px;">지정된 오라클 DB에 접속하여 원하는 객체를 .sql 파일로 추출합니다.</p>
    
    <div class="form-section">
        <div class="form-group">
            <label class="title-label">👤 DB 접속 계정:</label>
            <input type="text" id="dbUser" value="iicu" placeholder="예: iicu">
        </div>
        
        <div class="form-group">
            <label class="title-label">🔑 DB 접속 비밀번호:</label>
            <input type="password" id="dbPassword" placeholder="비밀번호를 입력하세요">
        </div>
        
        <div class="form-group">
            <label class="title-label">🔗 DB DSN (접속정보):</label>
            <input type="text" id="dbDsn" value="172.27.23.30:6000/DEV" placeholder="IP:PORT/SID">
        </div>
        
        <div class="form-group">
            <label class="title-label">🎯 추출 대상 계정명:</label>
            <input type="text" id="targetSchema" value="IICU" placeholder="추출할 객체를 소유한 계정명">
        </div>
        
        <div class="form-group">
            <label class="title-label">📂 저장할 서버 폴더:</label>
            <input type="text" id="outputDir" value="C:\oracle_ddl_export" placeholder="예: C:\oracle_ddl_export">
        </div>
        <div class="info-text" style="margin-bottom: 15px;">※ 파일은 웹 서버가 실행 중인 PC의 해당 경로에 저장됩니다.</div>

        <div class="form-group" style="background-color: #f8f9fa; padding: 10px; border-radius: 4px; border: 1px solid #e9ecef;">
            <label class="title-label">📌 추출 대상 객체:</label>
            <div class="checkbox-list">
                <label><input type="checkbox" name="objType" value="TABLE" checked> Table</label>
                <label><input type="checkbox" name="objType" value="PACKAGE" checked> Package</label>
                <label><input type="checkbox" name="objType" value="PROCEDURE" checked> Procedure</label>
                <label><input type="checkbox" name="objType" value="FUNCTION" checked> Function</label>
                <label><input type="checkbox" name="objType" value="VIEW" checked> View</label>
            </div>
        </div>
    </div>
    
    <button id="btnStart" class="btn-extract" onclick="startExtraction()">🚀 DDL 추출 시작</button>
    
    <h5 style="margin-top: 30px; font-weight: bold; font-size: 15px; color: #333;">진행 상황 로그:</h5>
    <div id="logArea" class="log-area">대기 중... 추출 시작 버튼을 눌러주세요.</div>
</div>

<script>
    async function startExtraction() {
        const dbUser = document.getElementById('dbUser').value.trim();
        const dbPassword = document.getElementById('dbPassword').value.trim();
        const dbDsn = document.getElementById('dbDsn').value.trim();
        const targetSchema = document.getElementById('targetSchema').value.trim();
        const outputDir = document.getElementById('outputDir').value.trim();
        
        // 🚀 체크된 객체 타입들을 배열로 수집
        const checkboxes = document.querySelectorAll('input[name="objType"]:checked');
        const selectedTypes = Array.from(checkboxes).map(cb => cb.value);

        const logArea = document.getElementById('logArea');
        const btnStart = document.getElementById('btnStart');

        if (!dbUser || !dbPassword || !dbDsn || !targetSchema || !outputDir) {
            alert("모든 입력 항목을 채워주세요.");
            return;
        }

        if (selectedTypes.length === 0) {
            alert("최소 하나의 추출 대상 객체를 선택해주세요.");
            return;
        }

        btnStart.disabled = true;
        btnStart.innerText = "⏳ 추출 작업 진행 중...";
        logArea.innerText = `▶ [${selectedTypes.join(', ')}] 객체 추출 작업을 시작합니다...\n(객체 수에 따라 수 분이 소요될 수 있습니다. 창을 닫지 마세요.)\n\n`;

        try {
            const response = await fetch('/api/extract/ddl', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user: dbUser,
                    password: dbPassword,
                    dsn: dbDsn,
                    target: targetSchema,
                    output_dir: outputDir,
                    object_types: selectedTypes // 🚀 서버로 배열 전송
                })
            });

            const result = await response.json();

            if (response.ok) {
                logArea.innerText += result.log;
                alert("작업 완료: DDL 추출 및 저장이 완료되었습니다.");
            } else {
                logArea.innerText += `\n❌ [서버 오류 발생]\n${result.error || result.log}`;
                alert("추출 중 오류가 발생했습니다. 로그를 확인하세요.");
            }
        } catch (error) {
            logArea.innerText += `\n❌ [통신 오류 발생]\n${error.message}`;
        } finally {
            btnStart.disabled = false;
            btnStart.innerText = "🚀 DDL 추출 시작";
            logArea.scrollTop = logArea.scrollHeight;
        }
    }
</script>
{% endblock %}
