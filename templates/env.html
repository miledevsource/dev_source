{% extends "base.html" %}

{% block content %}
<style>
    .setting-container { background-color: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 900px; margin: 20px; }
    .setting-container h2 { color: #333; border-bottom: 2px solid #17a2b8; padding-bottom: 10px; font-weight: 700; font-size: 20px; }
    
    .db-section { background-color: #f8f9fa; border: 1px solid #dee2e6; border-radius: 6px; padding: 20px; margin-bottom: 25px; }
    .section-title { font-size: 16px; font-weight: bold; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
    .title-ora { color: #d81b2f; }
    .title-pg { color: #336791; }
    
    .form-group { display: flex; align-items: center; margin-bottom: 12px; }
    .form-group label.title-label { width: 140px; font-weight: 600; font-size: 14px; color: #444; margin-bottom: 0; flex-shrink: 0; }
    .form-group input[type="text"], .form-group input[type="password"] { flex: 1; padding: 8px; border: 1px solid #ced4da; border-radius: 4px; font-size: 14px; }
    .form-group textarea { flex: 1; padding: 12px; border: 1px solid #ced4da; border-radius: 4px; font-size: 13px; min-height: 150px; font-family: Consolas, monospace; background-color: #fff; }

    .btn-custom { color: white; border: none; border-radius: 4px; padding: 10px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn-test { background-color: #6c757d; width: 100%; margin-top: 5px; }
    .btn-test:hover { background-color: #5a6268; }
    .btn-save-all { background-color: #28a745; width: 100%; padding: 15px; font-size: 16px; margin-top: 10px; }
    .btn-save-all:hover { background-color: #218838; }

    .hidden-section { display: none; margin-top: 20px; padding-top: 20px; border-top: 2px dashed #ccc; }

    /* 🚀 미리보기 모달(팝업) 스타일 추가 */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; }
    .modal-content { background: white; padding: 25px; border-radius: 8px; width: 800px; max-width: 95%; box-shadow: 0 5px 20px rgba(0,0,0,0.3); }
    .modal-content h3 { margin-top: 0; color: #333; border-bottom: 1px solid #eee; padding-bottom: 10px; font-size: 18px; }
    .modal-content textarea { width: 100%; height: 400px; font-family: Consolas, monospace; font-size: 14px; padding: 15px; border: none; border-radius: 4px; box-sizing: border-box; background-color: #1e1e1e; color: #00ff00; margin-bottom: 15px; resize: vertical; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
    .btn-cancel { background-color: #6c757d; }
    .btn-confirm { background-color: #007bff; }
</style>

<div class="setting-container">
    <h2>⚙️ 시스템 기본 DB 환경설정 (.env)</h2>
    <p style="font-size: 13px; color: #666; margin-bottom: 25px;">서버의 시스템 환경 변수를 실시간으로 조회하고 수정할 수 있습니다.</p>
    
    <div class="db-section">
        <div class="section-title title-ora">🟠 Oracle DB 연결 정보</div>
        <div class="form-group"><label class="title-label">👤 접속 계정:</label><input type="text" id="oraUser"></div>
        <div class="form-group"><label class="title-label">🔑 접속 비밀번호:</label><input type="password" id="oraPassword"></div>
        <div class="form-group"><label class="title-label">🔗 접속 DSN:</label><input type="text" id="oraDsn"></div>
        <button id="btnTestOra" class="btn-custom btn-test" onclick="testOracle()">🔌 Oracle 연결 테스트</button>
    </div>

    <div class="db-section">
        <div class="section-title title-pg">🐘 PostgreSQL 연결 정보</div>
        <div class="form-group"><label class="title-label">🌐 호스트 (IP):</label><input type="text" id="pgHost"></div>
        <div class="form-group"><label class="title-label">🚪 포트 (Port):</label><input type="text" id="pgPort"></div>
        <div class="form-group"><label class="title-label">🗄️ 데이터베이스명:</label><input type="text" id="pgDbName"></div>
        <div class="form-group"><label class="title-label">👤 접속 계정:</label><input type="text" id="pgUser"></div>
        <div class="form-group"><label class="title-label">🔑 접속 비밀번호:</label><input type="password" id="pgPassword"></div>
        <button id="btnTestPg" class="btn-custom btn-test" onclick="testPostgres()">🔌 PostgreSQL 연결 테스트</button>
        
        <div id="scriptSection" class="hidden-section">
            <div class="section-title" style="color: #333;">📝 테이블 초기 셋팅</div>
            <div class="form-group"><label class="title-label">🎯 기본 스키마명:</label><input type="text" id="pgSchema" value="icu"></div>
            <div class="form-group" style="align-items: flex-start;">
                <label class="title-label" style="margin-top: 10px;">📜 생성 스크립트:</label>
                <textarea id="pgScript" placeholder="CREATE TABLE ..."></textarea>
            </div>
            <button class="btn-custom" style="background-color: #ffc107; color: #333; width: 100%; margin-top: 5px;" onclick="alert('스크립트 실행 기능 대기 중!')">🚀 스크립트 DB에 실행</button>
        </div>
    </div>

    <button class="btn-custom btn-save-all" onclick="openPreviewModal()">👀 저장 전 변경사항 미리보기 (.env)</button>
</div>

<div id="envModal" class="modal-overlay">
    <div class="modal-content">
        <h3>📝 .env 파일 최종 저장 확인</h3>
        <p style="font-size: 13px; color: #666; margin-bottom: 10px;">아래 내용이 시스템 `.env` 파일에 덮어써집니다. 오타가 있다면 직접 텍스트를 수정하세요.</p>
        <textarea id="rawEnvText" spellcheck="false"></textarea>
        <div class="modal-actions">
            <button class="btn-custom btn-cancel" onclick="closeModal()">취소</button>
            <button class="btn-custom btn-confirm" onclick="confirmSaveRaw()">💾 이 내용으로 최종 저장</button>
        </div>
    </div>
</div>

<script>
    // 기존 데이터 불러오기 함수
    window.onload = async function() {
        try {
            const response = await fetch('/api/env/load');
            const data = await response.json();
            
            if (data.postgres.host) {
                document.getElementById('pgHost').value = data.postgres.host;
                document.getElementById('pgPort').value = data.postgres.port;
                document.getElementById('pgDbName').value = data.postgres.dbname;
                document.getElementById('pgUser').value = data.postgres.user;
                document.getElementById('pgPassword').value = data.postgres.password;
            }
            if (data.oracle.user) {
                document.getElementById('oraUser').value = data.oracle.user;
                document.getElementById('oraPassword').value = data.oracle.password;
                document.getElementById('oraDsn').value = data.oracle.dsn;
            }
        } catch (error) { console.error(".env 로드 실패:", error); }
    };

    function getOracleData() {
        return {
            user: document.getElementById('oraUser').value.trim(),
            password: document.getElementById('oraPassword').value.trim(),
            dsn: document.getElementById('oraDsn').value.trim()
        };
    }

    function getPgData() {
        return {
            host: document.getElementById('pgHost').value.trim(),
            port: document.getElementById('pgPort').value.trim(),
            dbname: document.getElementById('pgDbName').value.trim(),
            user: document.getElementById('pgUser').value.trim(),
            password: document.getElementById('pgPassword').value.trim()
        };
    }

    // DB 연결 테스트 기능
    async function testOracle() {
        const data = getOracleData();
        const btn = document.getElementById('btnTestOra');
        if (!data.user || !data.password || !data.dsn) return alert("Oracle 정보를 모두 입력하세요.");

        btn.disabled = true; btn.innerText = "⏳ 확인 중...";
        try {
            const res = await fetch('/api/env/test/oracle', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
            const result = await res.json();
            if (res.ok) { btn.style.backgroundColor = "#28a745"; btn.innerText = "✅ Oracle 연결 성공"; alert(result.message); }
            else throw new Error(result.error);
        } catch (e) { btn.style.backgroundColor = "#dc3545"; btn.innerText = "❌ 연결 실패 (재시도)"; alert(`오류: ${e.message}`); } 
        finally { btn.disabled = false; }
    }

    async function testPostgres() {
        const data = getPgData();
        const btn = document.getElementById('btnTestPg');
        if (!data.host || !data.user || !data.password) return alert("PostgreSQL 정보를 모두 입력하세요.");

        btn.disabled = true; btn.innerText = "⏳ 확인 중...";
        try {
            const res = await fetch('/api/env/test/postgres', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
            const result = await res.json();
            if (res.ok) { btn.style.backgroundColor = "#28a745"; btn.innerText = "✅ PostgreSQL 연결 성공"; document.getElementById('scriptSection').style.display = 'block'; alert(result.message); }
            else throw new Error(result.error);
        } catch (e) { btn.style.backgroundColor = "#dc3545"; btn.innerText = "❌ 연결 실패 (재시도)"; document.getElementById('scriptSection').style.display = 'none'; alert(`오류: ${e.message}`); } 
        finally { btn.disabled = false; }
    }

    // 🚀 모달 및 저장 프로세스 관련 기능
    function closeModal() {
        document.getElementById('envModal').style.display = 'none';
    }

    async function openPreviewModal() {
        const payload = { oracle: getOracleData(), postgres: getPgData() };
        
        try {
            // 서버에 조립된 가상 .env 텍스트를 요청
            const res = await fetch('/api/env/preview', {
                method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)
            });
            const result = await res.json();
            
            if (res.ok) {
                // 검은 바탕의 Textarea에 텍스트 뿌리고 팝업 열기
                document.getElementById('rawEnvText').value = result.preview_text;
                document.getElementById('envModal').style.display = 'flex';
            } else throw new Error(result.error || "미리보기 생성 실패");
        } catch (e) {
            alert(`❌ 미리보기 오류: ${e.message}`);
        }
    }

    async function confirmSaveRaw() {
        const rawText = document.getElementById('rawEnvText').value;

        try {
            const res = await fetch('/api/env/save-raw', {
                method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ raw_text: rawText })
            });
            const result = await res.json();
            
            if (res.ok) {
                alert(`✅ ${result.message}`);
                closeModal();
            } else throw new Error(result.error);
        } catch (e) {
            alert(`❌ 최종 저장 실패: ${e.message}`);
        }
    }
</script>
{% endblock %}
